<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Balance</title>
<link rel="icon" type="image/svg+xml" href="img/icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app is-booting" id="app">

  <header class="bar">
    <div class="brand" aria-label="Balance">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path class="mark-half" d="M12 2.75a9.25 9.25 0 0 1 0 18.5z" fill="currentColor"/>
      </svg>
      <span class="brand-name">Balance</span>
    </div>

    <div class="where" id="where">
      <span class="conn" id="conn" data-status="connecting"><i></i></span>
      <span class="where-project" id="where-project"></span>
      <span class="where-sep" aria-hidden="true">/</span>
      <span class="where-timeline" id="where-timeline"></span>
      <span class="demo-tag" id="demo-tag" hidden>데모</span>
    </div>

    <div class="bar-actions">
      <button class="icon-btn" id="btn-undo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기"><svg><use href="#i-undo"/></svg></button>
      <button class="icon-btn" id="btn-redo" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행"><svg><use href="#i-redo"/></svg></button>
      <span class="bar-gap"></span>
      <button class="icon-btn" id="btn-rescan" title="타임라인 다시 읽기" aria-label="타임라인 다시 읽기"><svg><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" id="btn-settings" title="설정" aria-label="설정" aria-haspopup="dialog"><svg><use href="#i-sliders"/></svg></button>
      <button class="icon-btn" id="btn-help" title="단축키 (?)" aria-label="단축키"><svg><use href="#i-key"/></svg></button>
      <button class="apply-btn" id="btn-apply" hidden>Resolve 에 적용</button>
      <button class="primary" id="btn-match">
        <span class="ring" aria-hidden="true"></span>
        <span class="primary-label" id="match-label">자동 매칭</span>
      </button>
    </div>
    <div class="progress" id="progress" aria-hidden="true"><i></i></div>
  </header>

  <nav class="rail" id="rail" aria-label="그룹">
    <div class="rail-list" id="rail-list"></div>
    <div class="rail-foot">
      <button class="ghost-btn" id="btn-new-group" disabled><svg><use href="#i-plus"/></svg><span>선택한 컷으로 그룹 만들기</span></button>
    </div>
  </nav>

  <main class="sheet" id="sheet">
    <div class="sheet-head">
      <h1 class="sheet-title"><span id="sheet-title">전체</span> <span class="sheet-count" id="sheet-count"></span></h1>
      <div class="sheet-tools">
        <div class="seg" id="seg-compare" role="group" aria-label="미리보기">
          <button data-v="after" class="is-on" title="보정 후 미리보기">보정 후</button>
          <button data-v="before" title="촬영본 그대로 (\ 누르고 있기)">촬영본</button>
        </div>
        <div class="seg" id="seg-size" role="group" aria-label="썸네일 크기">
          <button data-v="s" title="작게">작게</button>
          <button data-v="m" class="is-on" title="보통">보통</button>
          <button data-v="l" title="크게">크게</button>
        </div>
      </div>
    </div>
    <div class="notice" id="notice" hidden></div>
    <div class="grid" id="grid" data-size="m"></div>
    <div class="empty" id="empty" hidden></div>
  </main>

  <aside class="meter" id="meter" aria-label="노출 조정">
    <button class="meter-handle" id="meter-handle" aria-label="패널 접기/펼치기"><i></i></button>
    <div class="meter-none" id="meter-none">
      <svg class="meter-none-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1"/><path d="M12 2.75a9.25 9.25 0 0 1 0 18.5z" fill="currentColor"/></svg>
      <p>컷을 고르면 여기서 노출을 올리고 내립니다.</p>
      <p class="dim">그룹을 고르면 그 그룹 전체를 한 번에 움직입니다.</p>
    </div>

    <div class="meter-body" id="meter-body" hidden>
      <div class="m-head">
        <div class="m-title">
          <span class="m-no" id="m-no"></span>
          <span class="m-name" id="m-name"></span>
          <span class="m-count num" id="m-count"></span>
        </div>
        <div class="seg seg-wide" id="seg-scope" role="group" aria-label="조정 범위">
          <button data-v="cut" class="is-on">컷</button>
          <button data-v="group">그룹 전체</button>
        </div>
      </div>

      <section class="m-exposure">
        <div class="readout" id="readout" aria-live="polite">
          <span class="readout-val" id="readout-val">0</span>
          <span class="readout-unit">스톱</span>
        </div>
        <div class="readout-sub" id="readout-sub"></div>
        <div class="tape" id="tape" aria-hidden="true">
          <div class="tape-strip" id="tape-strip"></div>
          <div class="tape-needle"></div>
        </div>
        <div class="steps">
          <button class="step" id="step-down" title="노출 내리기 (↓)"><svg><use href="#i-minus"/></svg><span>어둡게</span></button>
          <button class="step" id="step-up" title="노출 올리기 (↑)"><svg><use href="#i-plus"/></svg><span>밝게</span></button>
        </div>
        <div class="dial-hint"><span>한 번에 <b class="num"><span class="frac">1/3</span></b> 스톱</span><span>Shift <b class="num"><span class="frac">1/10</span></b></span><span>Ctrl <b class="num">1</b></span></div>
      </section>

      <section class="m-layers" id="m-layers">
        <div class="layer" id="layer-auto">
          <span class="layer-name">자동 매칭</span>
          <span class="layer-bar"><i></i></span>
          <span class="layer-val num" id="lv-auto">0</span>
          <button class="switch" id="sw-auto" role="switch" aria-checked="true" aria-label="자동 매칭값 사용"><i></i></button>
          <div class="layer-note" id="auto-note"></div>
        </div>
        <div class="layer" id="layer-group">
          <span class="layer-name">그룹 의도</span>
          <span class="layer-bar"><i></i></span>
          <span class="layer-val num" id="lv-group">0</span>
          <span></span>
        </div>
        <div class="layer" id="layer-cut">
          <span class="layer-name">컷 의도</span>
          <span class="layer-bar"><i></i></span>
          <span class="layer-val num" id="lv-cut">0</span>
          <button class="tiny-btn" id="btn-reset-intent" title="의도 값 지우기 (0)">지우기</button>
        </div>
      </section>

      <section class="m-wb">
        <div class="m-sub">
          <span>화이트밸런스</span>
          <button class="switch" id="sw-wb" role="switch" aria-checked="true" aria-label="자동 화이트밸런스 사용"><i></i></button>
        </div>
        <div class="wb">
          <button class="wb-btn wb-g" data-tint="-1" title="그린 쪽으로"><i></i>그린</button>
          <button class="wb-btn wb-c" data-temp="-1" title="차갑게"><i></i>차갑게</button>
          <div class="wb-pad" id="wb-pad" aria-hidden="true"><i class="wb-auto" id="wb-auto"></i><i class="wb-dot" id="wb-dot"></i></div>
          <button class="wb-btn wb-w" data-temp="1" title="따뜻하게"><i></i>따뜻하게</button>
          <button class="wb-btn wb-m" data-tint="1" title="마젠타 쪽으로"><i></i>마젠타</button>
        </div>
        <div class="wb-note" id="wb-note"></div>
      </section>

      <section class="m-actions" id="m-actions">
        <button class="act" id="act-ref" title="이 컷을 그룹의 기준으로 (R)"><svg><use href="#i-target"/></svg><span>기준 컷</span></button>
        <button class="act" id="act-lock" title="지금 값으로 잠그기 (L)"><svg><use href="#i-lock"/></svg><span>잠금</span></button>
        <button class="act" id="act-exclude" title="자동 매칭에서 빼기 (X)"><svg><use href="#i-ban"/></svg><span>매칭 제외</span></button>
      </section>

      <section class="m-info" id="m-info">
        <label class="field">
          <span class="field-name">입력 색공간</span>
          <select id="sel-space"></select>
        </label>
        <div class="field-note" id="space-note"></div>
        <ul class="notes" id="notes"></ul>
      </section>

      <section class="m-group" id="m-group" hidden>
        <label class="field">
          <span class="field-name">그룹 이름</span>
          <input type="text" id="g-name" maxlength="40" spellcheck="false">
        </label>
        <div class="field">
          <span class="field-name">맞추는 기준</span>
          <div class="seg seg-wide" id="seg-mode" role="group">
            <button data-v="reference">기준 컷</button>
            <button data-v="median">그룹 중앙값</button>
          </div>
        </div>
        <div class="field-note" id="g-note"></div>
        <button class="tiny-btn danger" id="btn-del-group">그룹 풀기</button>
      </section>
    </div>
  </aside>

  <footer class="wedge" id="wedge" aria-label="타임라인 노출 띠">
    <div class="wedge-labels"><span>촬영본</span><span>보정 후</span></div>
    <div class="wedge-track" id="wedge-track"></div>
  </footer>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="pop-layer" id="pop-layer"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-undo" viewBox="0 0 16 16"><path d="M5.5 3.5 2.5 6.5l3 3M2.5 6.5H10a3.5 3.5 0 0 1 0 7H7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-redo" viewBox="0 0 16 16"><path d="m10.5 3.5 3 3-3 3M13.5 6.5H6a3.5 3.5 0 0 0 0 7h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 16 16"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="11.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-key" viewBox="0 0 16 16"><rect x="1.75" y="4" width="12.5" height="8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4.4 6.6h.01M7 6.6h.01M9.6 6.6h.01M12 6.6h.01M5 9.4h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 16 16"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3.25" y="7" width="9.5" height="6.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-ban" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m4.2 11.8 7.6-7.6" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-target" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.7" fill="currentColor"/></symbol>
    <symbol id="i-zap" viewBox="0 0 16 16"><path d="M9 1.8 3.6 9h3.6L6.6 14.2 12.4 7H8.6z" fill="currentColor"/></symbol>
    <symbol id="i-wave" viewBox="0 0 16 16"><path d="M1.5 8c1.6-4.5 3.2-4.5 4.8 0s3.2 4.5 4.8 0 2.3-3.4 3.4-1.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-ramp" viewBox="0 0 16 16"><path d="M2 12.5 14 4M14 4v4.2M14 4H9.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 2.2 14.3 13H1.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.4v3.2M8 11.3h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-ring" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-unlink" viewBox="0 0 16 16"><rect x="2.5" y="4.5" width="11" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M0.8 8h1.7M13.5 8h1.7M4.2 13.6 11.8 2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 16 16"><path d="M3.5 8h.01M8 8h.01M12.5 8h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 16 16"><path d="M4 1.8h5l3 3v9.4H4zM9 1.8v3h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="m6 8.5 4 4M10 8.5l-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<script type="module" src="js/app.js"></script>
</body>
</html>
